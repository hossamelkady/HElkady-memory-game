<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>لعبة الذاكرة</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7c3aed"><link rel="stylesheet" href="style.css"><style>:root{--c:#7c3aed}
#grid{display:grid;gap:8px;margin:12px 0}
.c{aspect-ratio:1;border-radius:14px;background:#7c3aed;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer}
.c.open{background:#fff;color:#000}.c.done{background:#bbf7d0;color:#000}</style></head><body>
<header>🧠 لعبة الذاكرة</header><main>
<div class="card row"><div><label>المستوى</label><select id="level"><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select></div><button id="new" style="margin-top:22px">لعبة جديدة</button></div>
<div class="card row" style="text-align:center"><div>الحركات<div class="big" id="moves">0</div></div><div>الوقت<div class="big" id="time">0</div></div><div>الأفضل<div class="big" id="best">-</div></div></div>
<div id="msg" class="big" style="text-align:center"></div><div id="grid"></div></main>
<script src="logic.js"></script><script src="app.js"></script></body></html>
